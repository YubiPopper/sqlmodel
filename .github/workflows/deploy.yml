name: Deploy SQLModel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            set -e

            cd ~/sqlmodel

            git pull origin main

            npm ci

            npm run build

            # Install signaling server runtime deps
            cd signaling-server
            npm ci --omit=dev
            cd ..

            # Restart services if they exist on the server.
            if command -v systemctl >/dev/null 2>&1; then
              if systemctl list-unit-files | grep -q '^sqlmodel.service'; then
                sudo systemctl restart sqlmodel
              fi
              if systemctl list-unit-files | grep -q '^sqlmodel-signaling.service'; then
                sudo systemctl restart sqlmodel-signaling
              fi
            fi

            # PM2 fallback if systemd units are not used
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart sqlmodel || true
              pm2 restart sqlmodel-signaling || true
            fi