name: Deploy SQLModel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            set -e

            cd ~/sqlmodel

            git pull origin main

            npm ci

            npm run build

            restarted=0

            # Try systemd restart first (non-interactive sudo only)
            sudo -n systemctl restart sqlmodel